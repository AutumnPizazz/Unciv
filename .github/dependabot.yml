version: 2
updates:
  # GitHub Actions 工作流
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Gradle 依赖
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # TypeScript 服务端（server-ts）
  - package-ecosystem: "npm"
    directory: "/server-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      server-ts-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # VitePress 文档站
  - package-ecosystem: "npm"
    directory: "/docs-vitepress"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-vitepress-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
