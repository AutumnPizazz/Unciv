name: "CodeQL"

on:
  push:
    branches:
      - UncivCN
    # 纯文档/纯 CI 改动没有可分析的代码，跳过（原先连 docs 推送都会跑两套语言的全量分析）
    paths-ignore:
      - 'docs/**'
      - 'docs-vitepress/**'
      - '**/*.md'
      - '.github/**'
  pull_request:
    branches:
      - UncivCN
  schedule:
    - cron: '30 1 * * 0'
  # 需要时可在 Actions 页手动补跑一次
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
