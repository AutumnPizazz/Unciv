name: Sync to unciv-chinese-community

# 游戏仓库发版时自动向社区仓库发起同步 PR：
#   1. 生成 UncivCN 更新日志草稿（git log 提取本版本改动）
#   2. 生成开发者文档同步报告（docs/Modders ↔ 社区开发者专区）
#   3. 生成翻译状态报告（简体中文翻译完成度）
#   4. 生成 CoeHarMod 模组同步报告
# 以上内容提交到社区仓库的 sync/<版本号> 分支并创建 PR，人工审查后合并。
#
# 前置条件：在本仓库 Settings → Secrets and variables → Actions 中配置
#   COMMUNITY_SYNC_TOKEN —— 一个对 AutumnPizazz/unciv-chinese-community 有
#   写权限的 Personal Access Token（Fine-grained PAT，权限：Contents: Read/Write，
#   Pull requests: Read/Write；或 classic PAT 勾选 repo）。
#   缺少该 secret 时本工作流会跳过 PR 步骤并只生成内容（不推送）。

on:
  push:
    tags:
      - '*.*.*'                          # 如 4.21.5、4.21.5.1
      - 'v*.*.*'                         # 或 v4.21.5.1
  workflow_dispatch:                      # 也支持手动触发
    inputs:
      version:
        description: '目标版本号（留空则从 BuildConfig.kt 读取）'
        required: false
        default: ''

permissions:
  contents: read

env:
  COMMUNITY_SYNC_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出游戏仓库（含完整历史与 tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 检出社区仓库（写入需要 PAT）
        if: env.COMMUNITY_SYNC_TOKEN != ''
        run: |
          git clone "https://x-access-token:${COMMUNITY_SYNC_TOKEN}@github.com/AutumnPizazz/unciv-chinese-community.git" ../community-repo

      - name: 检出社区仓库（只读，无 PAT 时）
        if: env.COMMUNITY_SYNC_TOKEN == ''
        run: |
          git clone "https://github.com/AutumnPizazz/unciv-chinese-community.git" ../community-repo

      - name: 运行联动同步脚本
        id: sync
        run: |
          python .github/community-sync/sync.py --community-repo ../community-repo ${{ github.event.inputs.version != '' && format('--version {0}', github.event.inputs.version) || '' }}
          VERSION=$(python -c "import re; print(re.search(r'appVersion = \"([^\"]+)\"', open('buildSrc/src/main/kotlin/BuildConfig.kt').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 提交到社区仓库 sync 分支并创建 PR
        if: env.COMMUNITY_SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_SYNC_TOKEN }}
        run: |
          BRANCH="sync/${{ steps.sync.outputs.VERSION }}"
          cd ../community-repo
          git config user.name "unciv-cn-bot"
          git config user.email "unciv-cn-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add 更新日志/UncivCN/草稿-v${{ steps.sync.outputs.VERSION }}.md 同步报告/
          git commit -m "同步 UncivCN v${{ steps.sync.outputs.VERSION }} 更新内容（自动生成草稿，请人工整理）"
          git push origin "$BRANCH"
          cat > ../pr-body.md <<'PRBODY'
          由游戏仓库 CI 自动生成，请人工整理后合并：
          - 更新日志/UncivCN/草稿-v${{ steps.sync.outputs.VERSION }}.md —— 更新日志草稿（需整理进 index.md）
          - 同步报告/ —— 文档/翻译/模组同步核对报告
          
          合并前请：
          1. 将草稿内容整理进 更新日志/UncivCN/index.md（并把最新版本 Badge 移到新条目）
          2. 按报告核对开发者专区文档与翻译状态
          3. 删除本 PR 中的草稿/报告文件（或移动到合适位置）
          PRBODY
          # 若同名 PR 已存在则跳过创建
          EXISTING=$(gh pr list --repo AutumnPizazz/unciv-chinese-community --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            gh pr create --repo AutumnPizazz/unciv-chinese-community \
              --base main --head "$BRANCH" \
              --title "同步 UncivCN v${{ steps.sync.outputs.VERSION }} 更新内容" \
              --body-file ../pr-body.md
          else
            echo "PR 已存在: #$EXISTING"
          fi

      - name: 输出结果摘要
        run: |
          echo "版本: ${{ steps.sync.outputs.VERSION }}"
          ls -la ../community-repo/更新日志/UncivCN/ 2>/dev/null | tail -3
          ls ../community-repo/同步报告/ 2>/dev/null
