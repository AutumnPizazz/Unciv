# Jobs to test the code base and build the client and server app
name: Build and test

on:
  # Triggers the workflow on any push or pull request
  push:
    # 纯文档/纯 CI 改动跳过全量测试：文档站由 docs.yml 负责（其 generateDocs 步骤会编译 Kotlin），
    # 工作流 YAML 本身也不会被单测覆盖，两者都不值得跑一遍完整测试
    paths-ignore:
      - 'docs/**'
      - 'docs-vitepress/**'
      - '**/*.md'
      - '.github/**'
      - 'changelog.md'
  # 安全说明：pull_request_target 在 base 分支上下文中运行，默认的 actions/checkout
  # 检出的是 base 分支代码（而非 PR head 提交），因此不会执行来自不可信 fork 的代码。
  # 本工作流未显式 checkout PR head（无 ref: github.event.pull_request.head.sha 之类），
  # 故在此使用 pull_request_target 是安全的。
  pull_request_target:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一分支的连续推送只保留最新一个 run：新提交会取消上一提交仍在跑的测试（同一 commit 的
# 重复 run 自然也去重），既避免重复 run 互相抢占 runner CPU 导致性能冒烟测试间歇失败，
# 也省下已被取代的提交的整轮测试
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # We only need the minimum

  code-checks:
    name: Check code and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' package was pulled from Google's SDK repository; only platform-tools is needed here
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile kotlin and build classes
        run: ./gradlew classes

      - name: Run code checks
        id: run_checks
        continue-on-error: true
        run: |
          ./gradlew check 2>&1 | tee check_output.log
          echo "check_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Extract test failures
        if: steps.run_checks.outputs.check_exit_code != '0'
        id: extract_failures
        run: |
          # Extract relevant failure information from check output
          FAILURE_CONTENT=$(awk '/FAILED|STANDARD_OUT/{p=1} p{print} /^[[:space:]]*$/ && p{p=0}' check_output.log | head -100)

          # Save to file and create GitHub output
          echo "$FAILURE_CONTENT" > test_failures.txt

          # Create multiline output for GitHub
          echo "failures<<EOF" >> $GITHUB_OUTPUT
          echo "$FAILURE_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment test failures on PR
        if: steps.run_checks.outputs.check_exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ACTIONS_ACCESS_TOKEN }}
          script: |
            const fs = require('fs');
            const failures = fs.readFileSync('test_failures.txt', 'utf8');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## ❌ Test Failures Detected

            The following tests failed in this PR:

            \`\`\`
            ${failures}
            \`\`\`

            [View full test output](${runUrl})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail workflow if checks failed
        if: steps.run_checks.outputs.check_exit_code != '0'
        run: exit 1

  # TypeScript server (server-ts) 的类型检查、lint、测试与覆盖率
  server-ts:
    name: TypeScript server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # pnpm must be installed BEFORE actions/setup-node when using cache: pnpm —
      # setup-node runs `pnpm store path`, and without pnpm on PATH it fails with
      # "Dependencies lock file is not found ... package-lock.json,npm-shrinkwrap.json,yarn.lock".
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server-ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server-ts
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: server-ts
        run: pnpm typecheck

      - name: Lint
        working-directory: server-ts
        run: pnpm lint

      - name: Run tests
        working-directory: server-ts
        run: pnpm test

      - name: Run tests with coverage
        working-directory: server-ts
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ts-coverage
          path: server-ts/coverage
          retention-days: 7
