name: Detekt

on:
  pull_request:
    branches:
      - UncivCN
  push:
    branches:
      - UncivCN
    # 纯文档改动跳过静态检查（与 buildAndTest.yml 一致，由 docs.yml 兜底编译）
    paths-ignore:
      - 'docs/**'
      - 'docs-vitepress/**'
      - 'changelog.md'

jobs:
  detekt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'adopt'

    - name: Setup Detekt
      id: setup_detekt
      uses: peter-murray/setup-detekt@v3

    - name: Detekt errors
      run: detekt-cli --parallel --config .github/workflows/detekt_config/detekt-errors.yml

    - name: Detekt warnings
      run: detekt-cli --parallel --config .github/workflows/detekt_config/detekt-warnings.yml
