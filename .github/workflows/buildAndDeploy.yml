# This is a basic workflow to help you get started with Actions

name: Deploy

# Controls when the action will run.
on:
  # Triggers on tags (every release pushes a 4-part tag like 4.21.7.2)
  push:
    tags:
      - '*' # This doesn't mean that it HAS to have a tag, only that the workflow triggers when we push a tag

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-release-body:
    runs-on: ubuntu-latest

    outputs:
      release_body: ${{ steps.read_release.outputs.release_body }}
      release_body_zh: ${{ steps.read_release.outputs.release_body_zh }}
      whatsnew: ${{ steps.read_release.outputs.whatsnew }}

    steps:
      - uses: actions/checkout@v5

      - name: Read release notes from CN changelogs (EN + ZH), fall back to upstream changelog.md
        id: read_release
        shell: bash
        run: |
          ## UncivCN tags are 4-part (e.g. 4.21.6.3) and only exist in docs/UncivCN/Changelog.md
          ## and docs/zh/UncivCN/Changelog.md
          TAG=${{ github.ref_name }}

          ## English: CN changelog first, upstream changelog.md as fallback
          en=$(grep -Pzo '\#{2}.'"$TAG"'[^\#]*\#{2}' docs/UncivCN/Changelog.md || \
               grep -Pzo '\#{2}.'"$TAG"'[^\#]*\#{2}' changelog.md || true)
          ## Chinese: CN zh changelog
          zh=$(grep -Pzo '\#{2}.'"$TAG"'[^\#]*\#{2}' docs/zh/UncivCN/Changelog.md || true)

          ## Drop the section header line and the trailing "##" matched by the pattern
          en=$(echo "$en" | head -n -2 | tail -n +3)
          zh=$(echo "$zh" | head -n -2 | tail -n +3)
          ## whatsnew needs a safe single-file version: no quotes or backticks
          whatsnew=$(echo "$en" | tr '"' "'" | tr '`' "'")

          ## See https://trstringer.com/github-actions-multiline-strings/

          echo "--- Set variables manually in github env ---"

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo "$en" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "release_body_zh<<EOF" >> $GITHUB_OUTPUT
          echo "$zh" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "whatsnew<<EOF" >> $GITHUB_OUTPUT
          echo "$whatsnew" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-jar:
    runs-on: ubuntu-latest
    needs: get-release-body
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile kotlin and build classes
        run: ./gradlew classes

      - name: Run code checks
        run: ./gradlew check

      - name: Run unit tests
        run: ./gradlew --no-build-cache cleanTest test tests:test

      - name: build UncivServer.jar
        continue-on-error: true
        run: |
          ./gradlew desktop:dist
          ./gradlew desktop:zipLinuxFilesForJar

      - name: Upload JAR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UncivCNJar
          path: |
            desktop/build/libs/UncivCN.jar

      - name: Upload linux files
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UncivLinuxFiles
          path: |
            deploy/linuxFilesForJar.zip

      - name: build UncivServer.jar
        continue-on-error: true
        run: |
          ./gradlew server:dist

      - name: Checkout TS server submodule
        run: git submodule update --init --depth 1 server-ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install TS server dependencies
        working-directory: server-ts
        run: pnpm install --frozen-lockfile

      - name: Typecheck TS server
        working-directory: server-ts
        run: pnpm typecheck

      - name: Test TS server
        working-directory: server-ts
        run: pnpm test

      - name: Build and package UncivSrv Docker image
        working-directory: server-ts
        run: |
          docker build -t unciv-srv:${{ github.ref_name }} .
          mkdir -p ../deploy
          docker save unciv-srv:${{ github.ref_name }} | gzip > ../deploy/UncivSrv-${{ github.ref_name }}.tar.gz

      - name: Upload UncivSrv Docker image
        uses: actions/upload-artifact@v4
        with:
          name: UncivSrv
          path: deploy/UncivSrv-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: Build Unciv Lua API VSCode extension (vsix)
        run: |
          mkdir -p deploy
          cd unciv-lua-api
          npx --yes @vscode/vsce package --out ../deploy/unciv-lua-api-${{ github.ref_name }}.vsix

      - name: Upload Lua API extension
        uses: actions/upload-artifact@v4
        with:
          name: UncivLuaAPI
          path: deploy/unciv-lua-api-*.vsix
          if-no-files-found: error

      - name: Upload Server
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UncivServer
          path: server/build/libs/UncivServer.jar

  android-build:
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: get-release-body
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare .aab (for Google Play) and .apk (for Github) files
        shell: bash
        run: |
          mkdir whatsNewDirectory
          body="${{needs.get-release-body.outputs.whatsnew}}"
          while [ ${#body} -gt 500 ]; do
            body="${body%$'\n'*}"
          done
          echo "$body" > whatsNewDirectory/whatsnew-en-US
          for attempt in 1 2 3; do
            ./gradlew :android:bundleRelease :android:assembleRelease && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      # UncivCN 分支的签名工具链与本地发布脚本一致（python_tool/UncivCN-release）：
      # zipalign 对齐 + apksigner V3 签名，密钥为本地 release.jks（上云为 secrets）。
      - name: Restore release keystore from secrets
        shell: bash
        run: |
          echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 -d > release.jks
          ls -la release.jks

      - name: Sign APK (zipalign + apksigner, same as local release toolchain)
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          echo "使用 build-tools: $BUILD_TOOLS"
          mkdir -p signed
          "$ZIPALIGN" -p 4 android/build/outputs/apk/release/UncivCN-release-unsigned.apk signed/aligned.apk
          printf '%s\n%s\n' "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" "${{ secrets.RELEASE_KEY_PASSWORD }}" > signed/password.txt
          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --ks-pass "file:signed/password.txt" \
            --key-pass "file:signed/password.txt" \
            --v3-signing-enabled true \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --out "signed/UncivCN-${{ github.ref_name }}.Apk" \
            signed/aligned.apk
          ls -la signed/

      - name: Upload APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: UncivCNAPK
          path: signed/UncivCN-${{ github.ref_name }}.Apk


  packr-build:
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download JAR
        uses: actions/download-artifact@v4
        # See 'Upload JAR' step in 'build' job
        with:
          name: UncivCNJar

      - name: Display structure of downloaded files
        run: ls -R

      - name: Packr build
        run: |
          mkdir -p desktop/build/libs
          mv UncivCN.jar desktop/build/libs

          wget -q -O packr-all-4.0.0.jar https://github.com/libgdx/packr/releases/download/4.0.0/packr-all-4.0.0.jar

          wget -q -O jre-linux-64.tar.gz https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse
          ./gradlew desktop:packrLinux64

          wget -q -O jdk-windows-64.zip https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse
          ./gradlew desktop:packrWindows64

      - name: Upload packed zips
        uses: actions/upload-artifact@v4
        with:
          name: UncivCNDeploymentZips
          path: |
            deploy/UncivCN-Windows64.zip
            deploy/UncivCN-Linux64.zip

  build-msi:
    continue-on-error: true
    needs: packr-build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5 # For the icon
      
      - name: Download packed zips
        uses: actions/download-artifact@v4
        with:
          name: UncivCNDeploymentZips
      
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Unzip unciv file
        run: | 
          mkdir .github/workflows/wix-msi-files
          tar -xf UncivCN-Windows64.zip -C .github/workflows/wix-msi-files
          dir .github/workflows/wix-msi-files
        
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
        
      - name: Build WiX on Windows
        shell: bash
        run: |
          UNCIV_VERSION=${{ github.ref_name }}
          # WiX/MSI 需要恰好 4 段版本号：3 段上游版本补 .0（如 4.21.5 → 4.21.5.0），
          # CN 4 段版本直接用（如 4.21.5.3），避免拼出非法的 5 段（4.21.5.3.0）
          if [[ "$UNCIV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            UNCIV_VERSION="$UNCIV_VERSION.0"
          fi
          UNCIV_VERSION=$UNCIV_VERSION wix build .github/workflows/unciv.wxs -o .github/workflows/UncivCN.msi


      - name: Show folders
        run: |
          dir
          dir .github/workflows/wix-msi-files

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UncivCN-MSI
          path: .github/workflows/UncivCN.msi
          if-no-files-found: error

  upload-github-release-and-post-to-discord:
    needs: [get-release-body, android-build, packr-build, build-msi]
    runs-on: ubuntu-latest
    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: consolidate deploy folder
        run: |
          mkdir deploy
          mv UncivCNJar/UncivCN.jar deploy/UncivCN-${{ github.ref_name }}.jar
          mv UncivLinuxFiles/linuxFilesForJar.zip deploy/linuxFilesForJar-${{ github.ref_name }}.zip
          mv UncivCNDeploymentZips/UncivCN-Windows64.zip deploy/UncivCN-Windows64-${{ github.ref_name }}.zip
          mv UncivCNDeploymentZips/UncivCN-Linux64.zip deploy/UncivCN-Linux64-${{ github.ref_name }}.zip
          mv UncivCNAPK/UncivCN-${{ github.ref_name }}.Apk deploy
          mv UncivServer/UncivServer.jar deploy/UncivServer-${{ github.ref_name }}.jar
          mv UncivSrv/UncivSrv-${{ github.ref_name }}.tar.gz deploy/
          mv UncivLuaAPI/unciv-lua-api-*.vsix deploy/
          [ -d "UncivCN-MSI" ] && mv UncivCN-MSI/UncivCN.msi deploy/UncivCN-${{ github.ref_name }}.msi || true

      # 模组作者 VSCode 扩展（薄拉取器）已在 build-jar job 内打包为 UncivLuaAPI artifact，
      # 上方 consolidate 已移入 deploy/；此处无需再打包
      - name: Check if this is a real release or a test version, for Github release
        id: check-version-tag
        run: |
          if [[ ${{ github.ref_name }} =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "real_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload binaries to Github release
        continue-on-error: true
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: deploy/*
          tag: ${{ github.ref }}
          # Release title = plain version number (e.g. "4.21.6.4"), nothing longer
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.check-version-tag.outputs.real_release != 'true' }}
          overwrite: true
          file_glob: true
          # <--- Use environment variables that was created earlier - see https://github.com/svenstaro/upload-release-action
          # Single-quotes do not solve the multiline problem.
          body: |
            ## ${{ github.ref_name }}

            ${{needs.get-release-body.outputs.release_body}}

            ${{needs.get-release-body.outputs.release_body_zh}}

  # 触发 CN 官方下载服务器从 GitHub（经 gh-proxy 镜像）同步安装包。
  # 服务器走镜像拉取（大陆服务器直连 GitHub release 不通），比 Actions 跨国上传更快。
  # 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）：
  #   CN_DL_SERVER : 下载服务器地址，如 http://sp.unciv.cn:30123
  #   CN_DL_USER   : 服务器管理员账号（与 server-ts 的 ADMIN_USERNAME 一致）
  #   CN_DL_PASS   : 服务器管理员密码（与 server-ts 的 ADMIN_PASSWORD 一致）
  # 未配置 Secrets 时本 job 自动跳过（不阻塞 release）。
  sync-installers-to-cn-server:
    needs: upload-github-release-and-post-to-discord
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CN download server sync
        env:
          DL_SERVER: ${{ secrets.CN_DL_SERVER }}
          DL_USER: ${{ secrets.CN_DL_USER }}
          DL_PASS: ${{ secrets.CN_DL_PASS }}
        run: |
          if [ -z "$DL_SERVER" ] || [ -z "$DL_USER" ] || [ -z "$DL_PASS" ]; then
            echo "未配置 CN_DL_SERVER / CN_DL_USER / CN_DL_PASS，跳过安装包同步"
            exit 0
          fi
          echo "触发服务器同步 tag=${{ github.ref_name }}"
          curl -sS -u "$DL_USER:$DL_PASS" -X POST \
            "$DL_SERVER/api/downloads/sync?tag=${{ github.ref_name }}" \
            -w '\nHTTP %{http_code}\n'
          echo "\n服务器同步完成，托管文件清单："
          curl -sS -u "$DL_USER:$DL_PASS" "$DL_SERVER/api/downloads"
